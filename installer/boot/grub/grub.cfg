# ============================================================================
# PrivacyOS UEFI boot menu (GRUB)
# 基于 Debian 13.7 DVD-1 的 /boot/grub/grub.cfg 修改
# ============================================================================
if [ x$feature_default_font_path = xy ] ; then
   font=unicode
else
   font=$prefix/font.pf2
fi

if loadfont $font ; then
  set gfxmode=1024x768
  set gfxpayload=keep
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod gfxterm
  insmod png
  terminal_output gfxterm
fi

if background_image /isolinux/splash.png; then
  set color_normal=light-gray/black
  set color_highlight=white/black
elif background_image /splash.png; then
  set color_normal=light-gray/black
  set color_highlight=white/black
else
  set menu_color_normal=cyan/blue
  set menu_color_highlight=white/blue
fi

set timeout=30
set default=0

menuentry 'Install PrivacyOS (Normal edition)' {
    set background_color=black
    linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed/normal.cfg vga=788 --- quiet
    initrd /install.amd/initrd.gz
}

menuentry 'Install PrivacyOS (Pro edition - full disk encryption)' {
    set background_color=black
    linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed/pro.cfg vga=788 --- quiet
    initrd /install.amd/initrd.gz
}

menuentry 'Install PrivacyOS (Normal edition - graphical)' {
    set background_color=black
    linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed/normal.cfg vga=788 --- quiet
    initrd /install.amd/gtk/initrd.gz
}

menuentry 'Install PrivacyOS (Pro edition - graphical)' {
    set background_color=black
    linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed/pro.cfg vga=788 --- quiet
    initrd /install.amd/gtk/initrd.gz
}

submenu 'Advanced options ...' {
    menuentry 'Manual install (expert, no preseed)' {
        set background_color=black
        linux /install.amd/vmlinuz priority=low vga=788 ---
        initrd /install.amd/initrd.gz
    }
    menuentry 'Rescue mode' {
        set background_color=black
        linux /install.amd/vmlinuz vga=788 rescue/enable=true --- quiet
        initrd /install.amd/initrd.gz
    }
    menuentry 'Boot from hard disk' {
        exit
    }
}
