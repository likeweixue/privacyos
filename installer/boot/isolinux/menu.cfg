# PrivacyOS installer menu (BIOS mode)
menu hshift 4
menu width 74
menu title PrivacyOS 1.0 Installer (Debian 13.7)

include txt.cfg
include gtk.cfg

label rescue
    menu label ^Rescue mode
    kernel /install.amd/vmlinuz
    append vga=788 rescue/enable=true initrd=/install.amd/initrd.gz --- quiet

label manual
    menu label ^Manual install (expert, no preseed)
    kernel /install.amd/vmlinuz
    append priority=low vga=788 initrd=/install.amd/initrd.gz ---

label local
    menu label Boot from ^hard drive
    localboot 0x80

label help
    menu label ^Help
    text help
  PrivacyOS is based on Debian 13.7 (Trixie).
  Normal edition: standard partitioning, no disk encryption.
  Pro edition: LUKS2 full-disk encryption + data destruction policy.
  The Pro LUKS passphrase is generated at ISO build time; see
  build/LUKS-PASSPHRASE.txt on the build machine.
  Rescue mode boots the Debian installer rescue shell.
    endtext
