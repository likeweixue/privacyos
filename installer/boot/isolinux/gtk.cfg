# PrivacyOS graphical automated installs
label privacyos-normal-gtk
    menu label Install PrivacyOS (Normal edition - ^graphical)
    kernel /install.amd/vmlinuz
    append auto=true priority=critical preseed/file=/cdrom/preseed/normal.cfg vga=788 initrd=/install.amd/gtk/initrd.gz --- quiet

label privacyos-pro-gtk
    menu label Install PrivacyOS (Pro edition - graphical)
    kernel /install.amd/vmlinuz
    append auto=true priority=critical preseed/file=/cdrom/preseed/pro.cfg vga=788 initrd=/install.amd/gtk/initrd.gz --- quiet
