# ============================================================================
# PrivacyOS BIOS boot menu (isolinux)
# 由构建脚本覆盖 Debian DVD 中的同名文件
#
# 注意：isolinux/vesamenu 对 CJK 字符支持有限，启动菜单使用英文，
#       安装完成后的系统 banner 与 Web 面板为中文。
# ============================================================================
path
prompt 0
timeout 300
default vesamenu.c32
include stdmenu.cfg
include menu.cfg
