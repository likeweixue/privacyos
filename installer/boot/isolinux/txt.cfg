# PrivacyOS text-mode automated installs
label privacyos-normal
    menu label ^Install PrivacyOS (Normal edition)
    menu default
    kernel /install.amd/vmlinuz
    append auto=true priority=critical preseed/file=/cdrom/preseed/normal.cfg vga=788 initrd=/install.amd/initrd.gz --- quiet

label privacyos-pro
    menu label Install PrivacyOS (^Pro edition - full disk encryption)
    kernel /install.amd/vmlinuz
    append auto=true priority=critical preseed/file=/cdrom/preseed/pro.cfg vga=788 initrd=/install.amd/initrd.gz --- quiet
