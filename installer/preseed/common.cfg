# ============================================================================
# PrivacyOS 公共 preseed 配置
# 基于 Debian 13.7 (Trixie) debian-13.7.0-amd64-DVD-1.iso
#
# 本文件由 build-iso.sh 与 normal.cfg / pro.cfg 合并后写入 ISO 的
# /preseed/<edition>.cfg。d-i 的 preseed 不支持 include，因此演示仓库中的
# 拆分文件只能通过构建脚本合并。
#
# 占位符：
#   __ADMIN_PASSWORD__  构建时生成的初始管理员密码（仅用于首次安装）
#   占位符不会出现在最终 ISO 中，构建脚本会校验替换结果。
# ============================================================================

### 语言与区域 ###
d-i debian-installer/locale string zh_CN.UTF-8
d-i debian-installer/language string zh_CN
d-i debian-installer/country string CN
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Asia/Shanghai

### 网络 ###
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string privacyos
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

### 软件源：默认使用 DVD 本地源（离线可安装核心系统） ###
# install.sh 会在网络可用时追加 deb.debian.org 在线源并安装可选组件。
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean true
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security

### 时钟 ###
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string ntp.aliyun.com

### 用户账号 ###
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string PrivacyOS Admin
d-i passwd/username string padmin
d-i passwd/user-password password __ADMIN_PASSWORD__
d-i passwd/user-password-again password __ADMIN_PASSWORD__
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false

### 分区（默认；专业版会覆盖为 crypt） ###
d-i partman-auto/method string regular
d-i partman-auto/init_automatically_partition select guided
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman/choose_partition select finish
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### 软件包 ###
# 以下软件包均存在于 debian-13.7.0-amd64-DVD-1 的 pool 中，离线可安装。
# Samba / NFS 服务端 / Docker 不在该 DVD-1 内，由 install.sh 在线补齐，
# 缺失时 PrivacyOS 面板会自动降级并在系统信息中标记组件不可用。
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo ca-certificates gnupg curl wget vim-tiny git rsync jq unzip p7zip-full htop lsof psmisc acl net-tools iproute2 logrotate rsyslog openssh-server smartmontools mdadm ffmpeg nftables cryptsetup btrfs-progs xfsprogs exfatprogs python3-minimal screen
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/updatedb boolean false
d-i pkgsel/install-language-support boolean false
popularity-contest popularity-contest/participate boolean false

### GRUB ###
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

### 完成 ###
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true

# late_command 位于 normal.cfg / pro.cfg（合并后由版本文件覆盖）。
