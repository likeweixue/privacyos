# ============================================================================
# PrivacyOS 专业版 preseed
# 默认使用 LUKS2 全盘加密 + 自动生成的安装口令
#
# 重要：构建 ISO 时由 build-iso.sh 将 __LUKS_PASSPHRASE__ 替换为随机口令，
# 并输出到 build/LUKS-PASSPHRASE.txt。请妥善保存，系统每次启动都需要它。
# 可在构建时通过 PRIVACYOS_LUKS_PASSPHRASE 环境变量指定自定义口令。
# ============================================================================

### 分区：全盘加密（LUKS2 + LVM） ###
d-i partman-auto/method string crypto
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/init_automatically_partition select guided
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-crypto/confirm boolean true
d-i partman-crypto/weak_passphrase boolean false
d-i partman-crypto/passphrase password __LUKS_PASSPHRASE__
d-i partman-crypto/passphrase-again password __LUKS_PASSPHRASE__

### 版本标识 + 安装脚本 ###
d-i preseed/late_command string \
    mkdir -p /target/opt/privacyos; \
    cp -a /cdrom/privacyos/. /target/opt/privacyos/; \
    cp -f /etc/resolv.conf /target/etc/resolv.conf 2>/dev/null || true; \
    in-target sh -c 'printf "pro\n" > /opt/privacyos/edition; chmod 0755 /opt/privacyos/install.sh; chmod 0755 /opt/privacyos/banner.sh; /opt/privacyos/install.sh'
