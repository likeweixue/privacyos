# ============================================================================
# PrivacyOS 普通版 preseed
# 由 build-iso.sh 与 common.cfg 合并后成为 ISO 中的 /preseed/normal.cfg
# ============================================================================

### 分区：普通分区（不加密） ###
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/init_automatically_partition select guided

### 版本标识 + 安装脚本 ###
# 1) 把 ISO 上的 /privacyos 载荷复制到目标系统
# 2) 写入版本标记
# 3) 在 chroot 中执行 install.sh（只做部署与 enable，不启动服务）
d-i preseed/late_command string \
    mkdir -p /target/opt/privacyos; \
    cp -a /cdrom/privacyos/. /target/opt/privacyos/; \
    cp -f /etc/resolv.conf /target/etc/resolv.conf 2>/dev/null || true; \
    in-target sh -c 'printf "normal\n" > /opt/privacyos/edition; chmod 0755 /opt/privacyos/install.sh; chmod 0755 /opt/privacyos/banner.sh; /opt/privacyos/install.sh'
