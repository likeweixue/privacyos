# ============================================================
# PrivacyOS 默认 Samba 配置
# 面板「网络与共享」保存后会重新生成此文件
# ============================================================
[global]
   workgroup = WORKGROUP
   server string = PrivacyOS NAS
   netbios name = privacyos
   security = user
   server role = standalone server
   map to guest = never
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   pam password change = yes
   server min protocol = SMB2_10
   client min protocol = SMB2_10
   disable netbios = yes
   smb encrypt = desired
   usershare allow guests = no

[users]
   comment = 用户文件
   path = /data/users
   browseable = yes
   read only = no
   guest ok = no
   valid users = @users
   create mask = 0700
   directory mask = 0700
   follow symlinks = no
   wide links = no

[photos]
   comment = 照片
   path = /data/photos
   browseable = yes
   read only = no
   guest ok = no
   valid users = @users
   create mask = 0700
   directory mask = 0700
   follow symlinks = no
   wide links = no

[movies]
   comment = 影视
   path = /data/movies
   browseable = yes
   read only = no
   guest ok = no
   valid users = @users
   create mask = 0700
   directory mask = 0700
   follow symlinks = no
   wide links = no
